# cargo deny check: licences, advisories, duplicate and unknown sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    # Mozilla's list of trusted certificate authorities (webpki-roots), which ureq uses to check the currency
    # rates server; it is data, not code
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# egui's bundled fallback fonts (symbols Geist lacks); fonts under these licences can ship in a program
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # the Linux tray (StatusNotifierItem); public domain
    { crate = "ksni", allow = ["Unlicense"] },
]

[licenses.private]
# the workspace crates are never published
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
