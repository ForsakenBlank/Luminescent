# The Rust rewrite in luminescent-rs/: formatting, lints, tests and the --smoke self-test on Linux and Windows.
# Only runs when something under luminescent-rs/ (or this file) changes; check.yml keeps testing the Python app.
name: rust

on:
  push:
    paths:
      - "luminescent-rs/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "luminescent-rs/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: luminescent-rs

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (the version in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: luminescent-rs
      - name: System libraries (winit needs libxkbcommon-x11; Xvfb and Mesa draw the windowed checks)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxkbcommon-x11-0 xvfb libegl1 libgl1-mesa-dri mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Tests with a display (start, hand over and quit inside eframe)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p luminescent --test instance --locked
      - name: Smoke test
        shell: bash
        run: |
          export LUMINESCENT_HOME="$RUNNER_TEMP/lumhome"
          code=0
          cargo run -p luminescent --locked -- --smoke || code=$?
          echo "--- warnings and errors in launcher.log ---"
          grep -E "WARNING|ERROR|panicked" "$LUMINESCENT_HOME/data/launcher.log" || echo "(none)"
          exit $code
      - name: Idle check
        shell: bash
        run: |
          export LUMINESCENT_HOME="$RUNNER_TEMP/idlehome"
          cargo run -p luminescent --locked -- --idle-check 20
      - name: Idle check with a window (Xvfb and llvmpipe)
        if: runner.os == 'Linux'
        run: |
          export LUMINESCENT_HOME="$RUNNER_TEMP/idlehome-x"
          xvfb-run -a -s "-screen 0 1280x800x24" cargo run -p luminescent --locked -- --idle-check 20

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: luminescent-rs/Cargo.toml
