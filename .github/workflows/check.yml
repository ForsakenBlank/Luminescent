# Starts Luminescent on Linux and Windows on every push (its --smoke self-test builds every page and
# pop-up once, then quits), so a change that breaks either system shows up as a red cross.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      LUMINESCENT_NO_HOOK: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Windows parts import
        if: runner.os == 'Windows'
        run: python -c "import core.hotkeys_win, core.autostart_win, core.desktop_win, core.wallpaper_win, modules.hearing_win, modules.media_win, core.syscontrol, modules.syscontrol; print('ok')"
      - name: System settings can be read (nothing is changed)
        shell: bash
        run: |
          python - <<'EOF'
          import sys
          from core import IS_WIN, syscontrol as sc
          print("backend:", sc.backend())
          for m in sc.monitors():
              print("monitor:", {k: v for k, v in m.items() if k != "modes"}, len(m["modes"]), "modes")
          opts = sc.options()
          for o in opts:
              print("option:", o.group, o.key, repr(o.get()))
          for k, v in sc.about():
              print("about:", k, "=", v)
          print("power:", sc.power_profiles(), sc.power_profile())
          print("sound:", sc.sound_devices("sinks"))
          if IS_WIN and len(opts) < 15:
              sys.exit("Windows settings could not be read")
          EOF
      - name: Smoke test
        shell: bash
        run: |
          export LUMINESCENT_HOME="$RUNNER_TEMP/lumhome"
          code=0
          python Launcher.py --smoke || code=$?
          echo "--- warnings and errors in launcher.log ---"
          grep -E "WARNING|ERROR|Traceback|  File " "$LUMINESCENT_HOME/data/launcher.log" || echo "(none)"
          exit $code
