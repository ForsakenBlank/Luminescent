[package]
name = "lum-platform"
description = "Hotkeys, windows, tray, notifications, clipboard, capture, launching and other OS services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
crc32fast.workspace = true
crossbeam-channel.workspace = true
interprocess.workspace = true
lum-core.workspace = true
tokio.workspace = true
tracing.workspace = true

lum-hypr.workspace = true
notify-rust = "4.19"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "vorbis", "flac", "mp3"] }
serde_json.workspace = true
lum-screen.workspace = true
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
jiff.workspace = true
shlex = "2"
# the system file dialogs (the desktop portal on Linux, the common dialogs on Windows)
rfd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# the data-control protocol: the clipboard works without one of our windows having the keyboard
arboard = { version = "3.7", features = ["wayland-data-control"] }
freedesktop-icons = "0.4"
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
mime_guess = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
# screenshots straight from the compositor (wlr-screencopy)
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(windows)'.dependencies]
arboard = "3.7"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[dev-dependencies]
lum-fixtures.workspace = true
lum-hypr = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[lints]
workspace = true
