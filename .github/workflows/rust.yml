# The Rust rewrite in luminescent-rs/: formatting, lints, tests and the --smoke self-test on Linux and Windows.
# Only runs when something under luminescent-rs/ (or this file) changes; check.yml keeps testing the Python app.
name: rust

on:
  push:
    paths:
      - "luminescent-rs/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "luminescent-rs/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: luminescent-rs

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (the version in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: luminescent-rs
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Smoke test
        shell: bash
        run: |
          export LUMINESCENT_HOME="$RUNNER_TEMP/lumhome"
          code=0
          cargo run -p luminescent --locked -- --smoke || code=$?
          echo "--- warnings and errors in launcher.log ---"
          grep -E "WARNING|ERROR|panicked" "$LUMINESCENT_HOME/data/launcher.log" || echo "(none)"
          exit $code

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: luminescent-rs/Cargo.toml
