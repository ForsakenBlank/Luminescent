[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
lum-core = { path = "crates/lum-core" }
lum-fixtures = { path = "crates/lum-fixtures" }
lum-platform = { path = "crates/lum-platform" }
lum-ui = { path = "crates/lum-ui" }

anyhow = "1"
jiff = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
interprocess = { version = "2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# catch_unwind keeps a faulty module from taking the app down, so panics must unwind
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
