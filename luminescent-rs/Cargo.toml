[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
lum-core = { path = "crates/lum-core" }
lum-fixtures = { path = "crates/lum-fixtures" }
lum-hypr = { path = "crates/lum-hypr" }
lum-theme = { path = "crates/lum-theme" }
lum-platform = { path = "crates/lum-platform" }
lum-ui = { path = "crates/lum-ui" }
lum-calc = { path = "crates/lum-calc" }
lum-screen = { path = "crates/lum-screen" }
lum-automation = { path = "crates/lum-automation" }
lum-perf = { path = "crates/lum-perf" }

anyhow = "1"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
jiff = "1"
nucleo-matcher = "0.3"
rqrr = "0.10"
qrcode = { version = "0.14", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
crossbeam-channel = "0.5"
fancy-regex = "0.20"
fastrand = "2"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
interprocess = { version = "2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# catch_unwind keeps a faulty module from taking the app down, so panics must unwind
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
