# Starts Luminescent on Linux and Windows on every push (its --smoke self-test builds every page and
# pop-up once, then quits), so a change that breaks either system shows up as a red cross.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      LUMINESCENT_NO_HOOK: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Windows parts import
        if: runner.os == 'Windows'
        run: python -c "import core.hotkeys_win, core.autostart_win, core.desktop_win, core.wallpaper_win, modules.hearing_win, modules.media_win; print('ok')"
      - name: Smoke test
        shell: bash
        run: |
          export LUMINESCENT_HOME="$RUNNER_TEMP/lumhome"
          python Launcher.py --smoke
