[package]
name = "lum-hypr"
description = "Hyprland sockets, the LUMI Lua bootstrap, binds, window rules and workspace sets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# a stand-in Hyprland for tests, here and in lum-platform
fake = ["dep:tempfile"]

[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tokio = { workspace = true, features = ["net", "rt", "io-util", "time"] }

[dev-dependencies]
lum-fixtures.workspace = true
lum-hypr = { path = ".", features = ["fake"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt", "io-util", "time", "macros"] }

[lints]
workspace = true
